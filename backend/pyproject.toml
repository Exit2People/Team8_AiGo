[project]
name = "aigo-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "anthropic",
  "pydantic",
  "python-dotenv",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-anthropic>=1.7.10",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
